<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synthux Touch 2 Debug</title>
    <style>
        :root {
            --bg: #0f1115;
            --panel: #16181e;
            --panel-border: #232732;
            --border: #2a2f3d;
            --text: #e2e8f0;
            --text-dim: #79839a;
            --accent: #e5b53b;
            --accent-dim: rgba(229, 181, 59, 0.15);
            --active-blue: #38bdf8;
            --pad-active: #f97316;
            --pad-active-glow: rgba(249, 115, 22, 0.35);
            --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar */
        header {
            background: var(--panel);
            border-bottom: 1px solid var(--panel-border);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: var(--mono);
            font-size: 13px;
        }

        .header-title {
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        select {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 4px 8px;
            border-radius: 4px;
            font-family: var(--mono);
            font-size: 12px;
            outline: none;
        }

        .btn-sync {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 4px;
            font-family: var(--mono);
            font-size: 11px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-sync:hover {
            border-color: var(--accent);
            background: var(--accent-dim);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
            display: inline-block;
        }
        .status-dot.connected {
            background: #22c55e;
            box-shadow: 0 0 6px #22c55e;
        }

        .rate-badge {
            color: var(--text-dim);
            font-size: 11px;
        }

        /* Two-Column App Layout: Left Debug Data / Right Physical Layout */
        .workspace {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Left Side: Debug Inspector */
        .debug-panel {
            width: 520px;
            flex-shrink: 0;
            background: var(--panel);
            border-right: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 12px;
            gap: 12px;
            font-family: var(--mono);
            font-size: 12px;
        }

        .section-header {
            color: var(--text-dim);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 4px;
        }

        /* Compact Data Tables */
        table.data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }

        table.data-table th {
            text-align: left;
            color: var(--text-dim);
            font-weight: 600;
            padding: 3px 6px;
            border-bottom: 1px solid var(--border);
            font-size: 10px;
        }

        table.data-table td {
            padding: 3px 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            white-space: nowrap;
        }

        table.data-table tr.active td {
            background: var(--accent-dim);
            color: #fff;
        }

        .bar-cell {
            width: 90px;
        }

        .mini-bar {
            height: 6px;
            background: #20242f;
            border-radius: 2px;
            overflow: hidden;
        }

        .mini-bar-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.05s ease-out;
        }

        .mini-bar-fill.pressure {
            background: var(--pad-active);
        }

        /* Live Event Log */
        .log-box {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            height: 130px;
            overflow-y: auto;
            padding: 4px 8px;
            display: flex;
            flex-direction: column-reverse;
            font-size: 10.5px;
            line-height: 1.4;
        }

        .log-entry {
            display: flex;
            gap: 8px;
            color: var(--text-dim);
        }

        .log-entry.note { color: var(--pad-active); }
        .log-entry.cc { color: var(--accent); }
        .log-entry.press { color: var(--active-blue); }
        .log-entry.diag { color: #a78bfa; font-size: 10px; }

        /* Right Side: Instrument Layout */
        .layout-panel {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background: var(--bg);
            overflow: auto;
        }

        svg.schematic {
            max-height: 100%;
            max-width: 100%;
            background: #12141a;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        /* SVG Layout Elements */
        .svg-pad {
            cursor: default;
        }
        .svg-pad circle.bg {
            fill: #222733;
            stroke: #40495e;
            stroke-width: 1.5;
            transition: fill 0.08s, stroke 0.08s;
        }
        .svg-pad.active circle.bg {
            fill: var(--pad-active);
            stroke: #ff9800;
            filter: drop-shadow(0 0 6px var(--pad-active-glow));
        }
        .svg-pad circle.meter {
            fill: none;
            stroke: #f97316;
            stroke-width: 3;
            stroke-dasharray: 0 160;
        }
        .svg-pad text.label {
            font-family: var(--mono);
            font-size: 10px;
            font-weight: 700;
            fill: #ffffff;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
        }
        .svg-pad text.sub {
            font-family: var(--mono);
            font-size: 7.5px;
            fill: #94a3b8;
            text-anchor: middle;
            dominant-baseline: central;
            pointer-events: none;
        }

        /* Knobs */
        .svg-knob circle.bg {
            fill: #181b22;
            stroke: #333a4c;
            stroke-width: 1.5;
        }
        .svg-knob line.pointer {
            stroke: #ffffff;
            stroke-width: 2.5;
            stroke-linecap: round;
        }
        .svg-knob text.name {
            font-family: var(--mono);
            font-size: 8.5px;
            fill: #94a3b8;
            text-anchor: middle;
            font-weight: 600;
        }
        .svg-knob text.val {
            font-family: var(--mono);
            font-size: 8.5px;
            fill: var(--accent);
            text-anchor: middle;
            font-weight: 700;
        }

        /* Sliders */
        .svg-slider rect.track {
            fill: #14161d;
            stroke: #2e3444;
            stroke-width: 1.5;
            rx: 3;
        }
        .svg-slider rect.fill {
            fill: var(--accent);
            rx: 2;
        }
        .svg-slider rect.cap {
            fill: #2c3242;
            stroke: #ffffff;
            stroke-width: 1.5;
            rx: 2;
        }

        /* Switches */
        .svg-switch rect.box {
            fill: #1a1d26;
            stroke: #3c4458;
            stroke-width: 1.5;
            rx: 3;
        }
        .svg-switch line.lever {
            stroke: #ffffff;
            stroke-width: 3.5;
            stroke-linecap: round;
            transition: transform 0.1s ease-out;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-title">
            <span id="statusDot" class="status-dot"></span>
            <span>TOUCH 2</span>
            <span id="statusLabel" style="color: var(--text-dim); font-weight: 400;">Connecting...</span>
        </div>
        <div class="header-controls">
            <select id="midiDeviceSelect">
                <option value="">(MIDI Input)</option>
            </select>
            <button id="recalBtn" class="btn-sync" style="border-color: #f59e0b; color: #f59e0b;" title="Re-zero touch capacitance">Re-Zero</button>
            <button id="syncBtn" class="btn-sync">Sync</button>
            <span id="msgRate" class="rate-badge">0 msg/s</span>
        </div>
    </header>

    <div class="workspace">

        <!-- Left Column: Controls & Pad State Table -->
        <div class="debug-panel">

            <!-- 12 Touch Pads Table -->
            <div>
                <div class="section-header">
                    <span>Touch Pads (P00–P11)</span>
                    <span id="padsTouchedCount" style="color: var(--accent);">0 Active</span>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Pad</th>
                            <th>Note</th>
                            <th>State</th>
                            <th>Press</th>
                            <th class="bar-cell">Meter</th>
                        </tr>
                    </thead>
                    <tbody id="padTableBody">
                        <!-- 12 rows generated by JS -->
                    </tbody>
                </table>
            </div>

            <!-- 8 Analog Controls (Knobs & Sliders) -->
            <div>
                <div class="section-header">
                    <span>Controls (S30–S37)</span>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Control</th>
                            <th>CC#</th>
                            <th>Val</th>
                            <th class="bar-cell">Level</th>
                        </tr>
                    </thead>
                    <tbody id="knobTableBody">
                        <!-- 8 rows generated by JS -->
                    </tbody>
                </table>
            </div>

            <!-- 2 Toggle Switches -->
            <div>
                <div class="section-header">
                    <span>Switches</span>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Switch</th>
                            <th>CC#</th>
                            <th>State</th>
                            <th>Val</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr id="sw-row-a">
                            <td><strong>SW A</strong></td>
                            <td>CC 80</td>
                            <td id="sw-state-a" style="font-weight: 700;">CTR</td>
                            <td id="sw-val-a">64</td>
                        </tr>
                        <tr id="sw-row-b">
                            <td><strong>SW B</strong></td>
                            <td>CC 81</td>
                            <td id="sw-state-b" style="font-weight: 700;">CTR</td>
                            <td id="sw-val-b">64</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Live Raw MIDI Log -->
            <div style="display: flex; flex-direction: column; flex: 1; min-height: 120px;">
                <div class="section-header">
                    <span>Event Stream</span>
                    <span style="cursor: pointer; color: var(--accent);" id="clearLogBtn">[Clear]</span>
                </div>
                <div id="midiLog" class="log-box"></div>
            </div>

        </div>

        <!-- Right Column: Physical Instrument Layout -->
        <div class="layout-panel">
            <svg class="schematic" width="480" height="660" viewBox="0 0 480 660" xmlns="http://www.w3.org/2000/svg">

                <!-- Chassis Frame -->
                <rect x="5" y="5" width="470" height="650" rx="10" fill="#141720" stroke="#2a3142" stroke-width="2"/>

                <!-- Top Pads P10 & P11 -->
                <g id="svg-pad-10" class="svg-pad" transform="translate(130, 45)">
                    <circle class="bg" cx="0" cy="0" r="22"/>
                    <circle id="svg-meter-10" class="meter" cx="0" cy="0" r="22"/>
                    <text class="label" y="-2">P10</text>
                    <text id="svg-sub-10" class="sub" y="8">C2</text>
                </g>

                <g id="svg-pad-11" class="svg-pad" transform="translate(350, 45)">
                    <circle class="bg" cx="0" cy="0" r="22"/>
                    <circle id="svg-meter-11" class="meter" cx="0" cy="0" r="22"/>
                    <text class="label" y="-2">P11</text>
                    <text id="svg-sub-11" class="sub" y="8">D2</text>
                </g>

                <!-- Left Slider S36 -->
                <g id="svg-slider-6" class="svg-slider" transform="translate(30, 110)">
                    <rect class="track" x="4" y="0" width="12" height="150"/>
                    <rect id="svg-fader-fill-6" class="fill" x="5" y="75" width="10" height="75"/>
                    <rect id="svg-fader-cap-6" class="cap" x="-3" y="65" width="26" height="16"/>
                    <text x="10" y="170" fill="#94a3b8" font-size="8.5" font-family="monospace" text-anchor="middle">S36</text>
                    <text id="svg-slider-val-6" x="10" y="182" fill="var(--accent)" font-size="9" font-family="monospace" font-weight="700" text-anchor="middle">64</text>
                </g>

                <!-- Right Slider S37 -->
                <g id="svg-slider-7" class="svg-slider" transform="translate(430, 110)">
                    <rect class="track" x="4" y="0" width="12" height="150"/>
                    <rect id="svg-fader-fill-7" class="fill" x="5" y="75" width="10" height="75"/>
                    <rect id="svg-fader-cap-7" class="cap" x="-3" y="65" width="26" height="16"/>
                    <text x="10" y="170" fill="#94a3b8" font-size="8.5" font-family="monospace" text-anchor="middle">S37</text>
                    <text id="svg-slider-val-7" x="10" y="182" fill="var(--accent)" font-size="9" font-family="monospace" font-weight="700" text-anchor="middle">64</text>
                </g>

                <!-- Upper Knobs: S31, S32, S33, S34 -->
                <!-- S31 -->
                <g id="svg-knob-1" class="svg-knob" transform="translate(115, 130)">
                    <circle class="bg" cx="0" cy="0" r="22"/>
                    <line id="svg-ptr-1" class="pointer" x1="0" y1="0" x2="0" y2="-18"/>
                    <text y="34" class="name">S31</text>
                    <text id="svg-val-1" y="45" class="val">64</text>
                </g>

                <!-- S32 -->
                <g id="svg-knob-2" class="svg-knob" transform="translate(195, 120)">
                    <circle class="bg" cx="0" cy="0" r="22"/>
                    <line id="svg-ptr-2" class="pointer" x1="0" y1="0" x2="0" y2="-18"/>
                    <text y="34" class="name">S32</text>
                    <text id="svg-val-2" y="45" class="val">64</text>
                </g>

                <!-- S33 -->
                <g id="svg-knob-3" class="svg-knob" transform="translate(285, 120)">
                    <circle class="bg" cx="0" cy="0" r="22"/>
                    <line id="svg-ptr-3" class="pointer" x1="0" y1="0" x2="0" y2="-18"/>
                    <text y="34" class="name">S33</text>
                    <text id="svg-val-3" y="45" class="val">64</text>
                </g>

                <!-- S34 -->
                <g id="svg-knob-4" class="svg-knob" transform="translate(365, 130)">
                    <circle class="bg" cx="0" cy="0" r="22"/>
                    <line id="svg-ptr-4" class="pointer" x1="0" y1="0" x2="0" y2="-18"/>
                    <text y="34" class="name">S34</text>
                    <text id="svg-val-4" y="45" class="val">64</text>
                </g>

                <!-- Lower Knobs: S30, S35 -->
                <!-- S30 -->
                <g id="svg-knob-0" class="svg-knob" transform="translate(125, 230)">
                    <circle class="bg" cx="0" cy="0" r="22"/>
                    <line id="svg-ptr-0" class="pointer" x1="0" y1="0" x2="0" y2="-18"/>
                    <text y="34" class="name">S30</text>
                    <text id="svg-val-0" y="45" class="val">64</text>
                </g>

                <!-- S35 -->
                <g id="svg-knob-5" class="svg-knob" transform="translate(355, 230)">
                    <circle class="bg" cx="0" cy="0" r="22"/>
                    <line id="svg-ptr-5" class="pointer" x1="0" y1="0" x2="0" y2="-18"/>
                    <text y="34" class="name">S35</text>
                    <text id="svg-val-5" y="45" class="val">64</text>
                </g>

                <!-- Toggle Switches: Switch A & Switch B -->
                <!-- Switch A -->
                <g id="svg-switch-a" class="svg-switch" transform="translate(205, 230)">
                    <rect class="box" x="-14" y="-20" width="28" height="40"/>
                    <line id="svg-sw-lever-a" class="lever" x1="0" y1="0" x2="0" y2="-15"/>
                    <text y="32" fill="#94a3b8" font-size="7.5" font-family="monospace" text-anchor="middle">SW A</text>
                    <text id="svg-sw-val-a" y="42" fill="var(--accent)" font-size="8" font-family="monospace" text-anchor="middle">CTR</text>
                </g>

                <!-- Switch B -->
                <g id="svg-switch-b" class="svg-switch" transform="translate(275, 230)">
                    <rect class="box" x="-14" y="-20" width="28" height="40"/>
                    <line id="svg-sw-lever-b" class="lever" x1="0" y1="0" x2="0" y2="-15"/>
                    <text y="32" fill="#94a3b8" font-size="7.5" font-family="monospace" text-anchor="middle">SW B</text>
                    <text id="svg-sw-val-b" y="42" fill="var(--accent)" font-size="8" font-family="monospace" text-anchor="middle">CTR</text>
                </g>

                <!-- Mountain Touch Pads: P00–P09 -->

                <!-- Top Peaks: P00, P01, P02 -->
                <g id="svg-pad-0" class="svg-pad" transform="translate(155, 360)">
                    <circle class="bg" cx="0" cy="0" r="22"/>
                    <circle id="svg-meter-0" class="meter" cx="0" cy="0" r="22"/>
                    <text class="label" y="-2">P00</text>
                    <text id="svg-sub-0" class="sub" y="8">C3</text>
                </g>

                <g id="svg-pad-1" class="svg-pad" transform="translate(240, 345)">
                    <circle class="bg" cx="0" cy="0" r="22"/>
                    <circle id="svg-meter-1" class="meter" cx="0" cy="0" r="22"/>
                    <text class="label" y="-2">P01</text>
                    <text id="svg-sub-1" class="sub" y="8">D3</text>
                </g>

                <g id="svg-pad-2" class="svg-pad" transform="translate(325, 360)">
                    <circle class="bg" cx="0" cy="0" r="22"/>
                    <circle id="svg-meter-2" class="meter" cx="0" cy="0" r="22"/>
                    <text class="label" y="-2">P02</text>
                    <text id="svg-sub-2" class="sub" y="8">E3</text>
                </g>

                <!-- Middle Ridge: P03, P04, P05, P06, P07 -->
                <g id="svg-pad-3" class="svg-pad" transform="translate(75, 460)">
                    <circle class="bg" cx="0" cy="0" r="22"/>
                    <circle id="svg-meter-3" class="meter" cx="0" cy="0" r="22"/>
                    <text class="label" y="-2">P03</text>
                    <text id="svg-sub-3" class="sub" y="8">F3</text>
                </g>

                <g id="svg-pad-4" class="svg-pad" transform="translate(160, 445)">
                    <circle class="bg" cx="0" cy="0" r="22"/>
                    <circle id="svg-meter-4" class="meter" cx="0" cy="0" r="22"/>
                    <text class="label" y="-2">P04</text>
                    <text id="svg-sub-4" class="sub" y="8">G3</text>
                </g>

                <g id="svg-pad-5" class="svg-pad" transform="translate(240, 460)">
                    <circle class="bg" cx="0" cy="0" r="22"/>
                    <circle id="svg-meter-5" class="meter" cx="0" cy="0" r="22"/>
                    <text class="label" y="-2">P05</text>
                    <text id="svg-sub-5" class="sub" y="8">A3</text>
                </g>

                <g id="svg-pad-6" class="svg-pad" transform="translate(320, 445)">
                    <circle class="bg" cx="0" cy="0" r="22"/>
                    <circle id="svg-meter-6" class="meter" cx="0" cy="0" r="22"/>
                    <text class="label" y="-2">P06</text>
                    <text id="svg-sub-6" class="sub" y="8">B3</text>
                </g>

                <g id="svg-pad-7" class="svg-pad" transform="translate(405, 460)">
                    <circle class="bg" cx="0" cy="0" r="22"/>
                    <circle id="svg-meter-7" class="meter" cx="0" cy="0" r="22"/>
                    <text class="label" y="-2">P07</text>
                    <text id="svg-sub-7" class="sub" y="8">C4</text>
                </g>

                <!-- Foothills: P08 & P09 -->
                <g id="svg-pad-8" class="svg-pad" transform="translate(180, 565)">
                    <circle class="bg" cx="0" cy="0" r="24"/>
                    <circle id="svg-meter-8" class="meter" cx="0" cy="0" r="24"/>
                    <text class="label" y="-2">P08</text>
                    <text id="svg-sub-8" class="sub" y="8">D4</text>
                </g>

                <g id="svg-pad-9" class="svg-pad" transform="translate(300, 565)">
                    <circle class="bg" cx="0" cy="0" r="24"/>
                    <circle id="svg-meter-9" class="meter" cx="0" cy="0" r="24"/>
                    <text class="label" y="-2">P09</text>
                    <text id="svg-sub-9" class="sub" y="8">E4</text>
                </g>

            </svg>
        </div>

    </div>

    <script>
        // Firmware Mappings
        const PAD_NOTES = [48, 50, 52, 53, 55, 57, 59, 60, 62, 64, 36, 38];
        const PAD_NAMES = ["P00", "P01", "P02", "P03", "P04", "P05", "P06", "P07", "P08", "P09", "P10", "P11"];
        const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

        function getNoteStr(midiNote) {
            const oct = Math.floor(midiNote / 12) - 1;
            return `${NOTE_NAMES[midiNote % 12]}${oct}`;
        }

        const KNOB_DEFS = [
            { id: "S30", cc: 14 },
            { id: "S31", cc: 15 },
            { id: "S32", cc: 16 },
            { id: "S33", cc: 17 },
            { id: "S34", cc: 18 },
            { id: "S35", cc: 19 },
            { id: "S36", cc: 1 },
            { id: "S37", cc: 21 }
        ];

        // State
        const padState = PAD_NOTES.map((note, i) => ({
            id: PAD_NAMES[i],
            note: note,
            touched: false,
            pressure: 0
        }));

        const knobState = KNOB_DEFS.map(() => ({ val: 64 }));
        let switchA = 1; // 0=Down, 1=Center, 2=Up
        let switchB = 1;

        // Build HTML Tables
        const padTableBody = document.getElementById("padTableBody");
        padTableBody.innerHTML = padState.map((p, i) => `
            <tr id="pad-row-${i}">
                <td><strong>${p.id}</strong></td>
                <td>${getNoteStr(p.note)}</td>
                <td id="pad-state-${i}" style="color: var(--text-dim);">RELEASED</td>
                <td id="pad-val-${i}">0</td>
                <td class="bar-cell">
                    <div class="mini-bar"><div id="pad-bar-${i}" class="mini-bar-fill pressure"></div></div>
                </td>
            </tr>
        `).join("");

        const knobTableBody = document.getElementById("knobTableBody");
        knobTableBody.innerHTML = KNOB_DEFS.map((k, i) => `
            <tr id="knob-row-${i}">
                <td><strong>${k.id}</strong></td>
                <td>CC ${k.cc}</td>
                <td id="knob-val-td-${i}">64</td>
                <td class="bar-cell">
                    <div class="mini-bar"><div id="knob-bar-${i}" class="mini-bar-fill" style="width: 50%;"></div></div>
                </td>
            </tr>
        `).join("");

        // Message Rate Monitor
        let msgCount = 0;
        let lastTime = performance.now();
        const msgRateEl = document.getElementById("msgRate");
        setInterval(() => {
            const now = performance.now();
            const elapsed = (now - lastTime) / 1000;
            const rate = Math.round(msgCount / elapsed);
            msgRateEl.textContent = `${rate} msg/s`;
            msgCount = 0;
            lastTime = now;
        }, 1000);

        // Log Box
        const midiLog = document.getElementById("midiLog");
        document.getElementById("clearLogBtn").onclick = () => { midiLog.innerHTML = ""; };

        function logEntry(cls, text) {
            msgCount++;
            const t = new Date().toTimeString().split(" ")[0];
            const div = document.createElement("div");
            div.className = `log-entry ${cls}`;
            div.innerHTML = `<span>[${t}]</span><span>${text}</span>`;
            midiLog.prepend(div);
            if (midiLog.children.length > 50) midiLog.removeChild(midiLog.lastChild);
        }

        // Update Handlers
        function setPad(i, touched, pressure) {
            const p = padState[i];
            p.touched = touched;
            p.pressure = pressure;

            // Update Table Row
            const row = document.getElementById(`pad-row-${i}`);
            const stateTd = document.getElementById(`pad-state-${i}`);
            const valTd = document.getElementById(`pad-val-${i}`);
            const bar = document.getElementById(`pad-bar-${i}`);

            if (touched) {
                row.classList.add("active");
                stateTd.textContent = "TOUCHED";
                stateTd.style.color = "var(--pad-active)";
            } else {
                row.classList.remove("active");
                stateTd.textContent = "RELEASED";
                stateTd.style.color = "var(--text-dim)";
            }
            valTd.textContent = pressure;
            bar.style.width = `${Math.round((pressure / 127) * 100)}%`;

            // Update SVG Schematic
            const svgPad = document.getElementById(`svg-pad-${i}`);
            const svgMeter = document.getElementById(`svg-meter-${i}`);
            const svgSub = document.getElementById(`svg-sub-${i}`);

            if (svgPad) {
                if (touched) svgPad.classList.add("active");
                else svgPad.classList.remove("active");
            }
            if (svgMeter) {
                const circ = (i === 8 || i === 9) ? 150 : 138; // 2 * PI * r
                const dash = (pressure / 127) * circ;
                svgMeter.style.strokeDasharray = `${dash} ${circ}`;
            }
            if (svgSub) {
                svgSub.textContent = touched ? `p:${pressure}` : getNoteStr(p.note);
            }

            // Update total active count
            const count = padState.filter(x => x.touched).length;
            document.getElementById("padsTouchedCount").textContent = `${count} Active`;
        }

        function setKnob(i, val) {
            knobState[i].val = val;

            // Table
            document.getElementById(`knob-val-td-${i}`).textContent = val;
            document.getElementById(`knob-bar-${i}`).style.width = `${Math.round((val / 127) * 100)}%`;

            // SVG
            if (i <= 5) {
                // Rotary Knob
                const deg = -135 + (val / 127) * 270;
                const ptr = document.getElementById(`svg-ptr-${i}`);
                const valText = document.getElementById(`svg-val-${i}`);
                if (ptr) ptr.setAttribute("transform", `rotate(${deg})`);
                if (valText) valText.textContent = val;
            } else {
                // Slider S36 (6) or S37 (7)
                const faderFill = document.getElementById(`svg-fader-fill-${i}`);
                const faderCap = document.getElementById(`svg-fader-cap-${i}`);
                const sliderVal = document.getElementById(`svg-slider-val-${i}`);

                const trackH = 150;
                const capY = trackH - (val / 127) * trackH - 8;
                const fillH = (val / 127) * trackH;
                const fillY = trackH - fillH;

                if (faderFill) {
                    faderFill.setAttribute("y", fillY);
                    faderFill.setAttribute("height", fillH);
                }
                if (faderCap) faderCap.setAttribute("y", capY);
                if (sliderVal) sliderVal.textContent = val;
            }
        }

        function setSwitch(sw, pos) {
            const isA = (sw === "A");
            if (isA) switchA = pos; else switchB = pos;

            const name = (pos === 2) ? "UP" : (pos === 1 ? "CTR" : "DN");
            const val = (pos === 2) ? 127 : (pos === 1 ? 64 : 0);

            // Table
            document.getElementById(`sw-state-${sw.toLowerCase()}`).textContent = name;
            document.getElementById(`sw-val-${sw.toLowerCase()}`).textContent = val;

            // SVG Lever
            const deg = (pos === 2) ? 30 : (pos === 1 ? 0 : -30);
            const lever = document.getElementById(`svg-sw-lever-${sw.toLowerCase()}`);
            const valText = document.getElementById(`svg-sw-val-${sw.toLowerCase()}`);

            if (lever) lever.setAttribute("transform", `rotate(${deg})`);
            if (valText) valText.textContent = name;
        }

        // Web MIDI Protocol Dispatcher
        function onMidiMsg(e) {
            msgCount++;
            const d = e.data;
            if (!d || d.length < 2) return;

            const type = d[0] & 0xF0;
            const d1 = d[1];
            const d2 = d.length > 2 ? d[2] : 0;

            if (type === 0x90 && d2 > 0) {
                // Note On (d2 is velocity)
                const idx = PAD_NOTES.indexOf(d1);
                if (idx !== -1) {
                    padState[idx].velocity = d2;
                    setPad(idx, true, padState[idx].pressure);
                    logEntry("note", `${PAD_NAMES[idx]} ON (${getNoteStr(d1)}) v=${d2}`);
                }
            } else if (type === 0x80 || (type === 0x90 && d2 === 0)) {
                // Note Off
                const idx = PAD_NOTES.indexOf(d1);
                if (idx !== -1) {
                    setPad(idx, false, 0);
                    logEntry("note", `${PAD_NAMES[idx]} OFF (${getNoteStr(d1)})`);
                }
            } else if (type === 0xA0) {
                // Polyphonic Aftertouch / Pressure
                const idx = PAD_NOTES.indexOf(d1);
                if (idx !== -1) {
                    setPad(idx, d2 > 0, d2);
                    logEntry("press", `${PAD_NAMES[idx]} PRESS=${d2}`);
                }
            } else if (type === 0xB0) {
                // Control Change
                const cc = d1;
                const val = d2;

                // Dedicated Pad CCs (30..41)
                if (cc >= 30 && cc <= 41) {
                    const idx = cc - 30;
                    setPad(idx, val > 0, val);
                    logEntry("press", `${PAD_NAMES[idx]} CC=${val}`);
                    return;
                }

                // Knobs & Sliders
                const knobIdx = KNOB_DEFS.findIndex(k => k.cc === cc);
                if (knobIdx !== -1) {
                    setKnob(knobIdx, val);
                    logEntry("cc", `${KNOB_DEFS[knobIdx].id} (CC ${cc})=${val}`);
                    return;
                }

                // Switch A (CC 80)
                if (cc === 80) {
                    const pos = (val >= 100) ? 2 : (val >= 40 ? 1 : 0);
                    setSwitch("A", pos);
                    logEntry("cc", `SW A=${pos === 2 ? "UP" : (pos === 1 ? "CTR" : "DN")}`);
                    return;
                }

                // Switch B (CC 81)
                if (cc === 81) {
                    const pos = (val >= 100) ? 2 : (val >= 40 ? 1 : 0);
                    setSwitch("B", pos);
                    logEntry("cc", `SW B=${pos === 2 ? "UP" : (pos === 1 ? "CTR" : "DN")}`);
                    return;
                }
            }
        }

        // Web MIDI Output & Interaction Handlers
        function sendMidiCc(cc, val) {
            if (!midiAccess) return;
            const outputs = Array.from(midiAccess.outputs.values());
            if (outputs.length > 0) {
                const out = (activePort && outputs.find(o => o.name === activePort.name)) || outputs[0];
                try {
                    out.send([0xB0, cc, val]);
                } catch (e) {
                    console.error("MIDI send error", e);
                }
            }
        }

        // Hardware Re-Zero Button
        const recalBtn = document.getElementById("recalBtn");
        if (recalBtn) {
            recalBtn.addEventListener("click", () => {
                sendMidiCc(112, 127);
                logEntry("diag", "Triggered Hardware Re-Zero (AN3889 Autoconfig)");
            });
        }

        // Web MIDI Setup & Auto Connect
        const statusDot = document.getElementById("statusDot");
        const statusLabel = document.getElementById("statusLabel");
        const deviceSelect = document.getElementById("midiDeviceSelect");
        const syncBtn = document.getElementById("syncBtn");
        let midiAccess = null;
        let activePort = null;

        async function initMidi() {
            if (!navigator.requestMIDIAccess) {
                statusLabel.textContent = "Web MIDI unsupported";
                return;
            }

            try {
                midiAccess = await navigator.requestMIDIAccess({ sysex: false });
                midiAccess.onstatechange = () => updatePorts(midiAccess);
                updatePorts(midiAccess);
            } catch (err) {
                statusLabel.textContent = `Denied: ${err.message}`;
            }
        }

        function updatePorts(midi) {
            const inputs = Array.from(midi.inputs.values());
            deviceSelect.innerHTML = '<option value="">(MIDI Input)</option>';

            let autoPick = null;
            inputs.forEach(input => {
                const opt = document.createElement("option");
                opt.value = input.id;
                opt.textContent = input.name;
                deviceSelect.appendChild(opt);

                const lower = (input.name || "").toLowerCase();
                if (!autoPick && (lower.includes("daisy") || lower.includes("seed") || lower.includes("bends"))) {
                    autoPick = input;
                }
            });

            if (autoPick) {
                deviceSelect.value = autoPick.id;
                connect(autoPick);
            } else if (inputs.length > 0 && !activePort) {
                deviceSelect.selectedIndex = 1;
                connect(inputs[0]);
            }
        }

        function sendSyncRequest() {
            sendMidiCc(120, 127);
            logEntry("cc", "REQUEST SYNC -> Touch 2");
        }

        function connect(port) {
            if (activePort) activePort.onmidimessage = null;
            activePort = port;
            activePort.onmidimessage = onMidiMsg;

            statusDot.classList.add("connected");
            statusLabel.textContent = port.name;
            logEntry("cc", `Connected: ${port.name}`);

            // Request initial state sync from hardware
            setTimeout(sendSyncRequest, 100);
        }

        syncBtn.onclick = () => {
            sendSyncRequest();
        };

        deviceSelect.onchange = () => {
            const id = deviceSelect.value;
            if (!id) return;
            navigator.requestMIDIAccess().then(m => {
                const p = m.inputs.get(id);
                if (p) connect(p);
            });
        };

        window.onload = () => {
            initMidi();
            for (let i = 0; i < 8; i++) setKnob(i, 64);
        };
    </script>
</body>
</html>
